services:
  # Backend Web Service
  - type: web
    name: autood-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements_render.txt
    startCommand: gunicorn main_render:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.9.21
      - key: TORCH_HOME
        value: /opt/data/torch
    disk:
      name: autood-data
      mountPath: /opt/data
      sizeGB: 2

  # Frontend Static Site
  - type: static_site
    name: autood-frontend
    env: node
    rootDir: Frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: autood-backend
          property: host
