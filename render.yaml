services:
  - type: web
    name: autood
    env: python
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn main_render:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:${PORT:-10000} --timeout 120 --keep-alive 5
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.9.21
      - key: NODE_VERSION
        value: 18
      - key: TORCH_HOME
        value: /opt/data/torch
    disk:
      name: autood-data
      mountPath: /opt/data
      sizeGB: 2