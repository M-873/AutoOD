services:
  # Backend Web Service
  - type: web
    name: autood-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn main_render:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PORT
        value: '10000'
      - key: PYTHON_VERSION
        value: 3.9.21
      - key: PIP_NO_CACHE_DIR
        value: '1'
      - key: TORCH_HOME
        value: /tmp/torch
