services:
  # Backend Web Service
  - type: web
    name: autood-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: bash build.sh
    startCommand: cd backend && uvicorn main_render:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 10
    envVars:
      - key: PORT
        value: '10000'
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PIP_NO_CACHE_DIR
        value: '1'
      - key: TORCH_HOME
        value: /tmp/torch
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: dqt6jvhoe
      - key: CLOUDINARY_API_KEY
        value: '215131412821171'
      - key: CLOUDINARY_API_SECRET
        sync: false
