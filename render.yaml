services:
  # Backend Web Service
  - type: web
    name: autood-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn main_render:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PORT
        value: '10000'
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PIP_NO_CACHE_DIR
        value: '1'
      - key: TORCH_HOME
        value: /tmp/torch
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: dqt6jvhoe
      - key: CLOUDINARY_API_KEY
        value: '215131412821171'
      - key: CLOUDINARY_API_SECRET
        sync: false
