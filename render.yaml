services:
  - type: web
    name: autood
    env: python
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.9.21
      - key: NODE_VERSION
        value: 18
      - key: TORCH_HOME
        value: /opt/data/torch
    disk:
      name: autood-data
      mountPath: /opt/data
      sizeGB: 2